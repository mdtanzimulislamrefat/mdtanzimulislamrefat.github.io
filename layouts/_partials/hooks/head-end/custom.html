<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<style>
/* Palette mirrors the résumé: navy accent rgb(31,78,121), gray #555. */
:root {
  --accent: #1f4e79;
  --accent-strong: #173b5c;
  --accent-soft: #edf2f7;
  --accent-line: #c6d3e1;
  --ink: #1a2330;
  --text: #3d4855;
  --muted: #555b63;
  --border: #dde3ea;
  --surface: #fff;
  --page: #f8f9fb;
  --serif: "Source Serif 4", "Latin Modern Roman", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html { scroll-behavior: smooth; scroll-padding-top: 2rem; }
body { background: var(--page); color: var(--ink); }
.hbb-section { padding: 0 !important; }
.portfolio-section { max-width: 920px; margin: 0 auto; padding: 44px 24px; }

/* Section headings: small caps over a navy rule, as in the résumé */
.section-heading { margin-bottom: 26px; padding-bottom: 12px; border-bottom: 1.5px solid var(--accent); }
.section-label, .card-label { color: var(--muted); font: 600 .69rem/1.6 var(--sans); letter-spacing: .11em; text-transform: uppercase; margin: 0 0 6px; }
.portfolio-section h2 { font-family: var(--serif); font-variant: small-caps; font-size: 1.85rem; font-weight: 600; letter-spacing: .02em; margin: 0; line-height: 1.25; color: var(--accent); }
.section-subtitle { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1rem; margin: 6px 0 0; }
.portfolio-section .prose { max-width: none; font-size: .96rem; line-height: 1.85; color: var(--text); }
.portfolio-section .prose a { color: var(--accent); }

.portfolio-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; align-items: start; }
.portfolio-card, .research-panel, .certificate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 1px 2px rgba(26,35,48,.04), 0 6px 20px rgba(26,35,48,.03); transition: border-color .2s, box-shadow .2s; }
.portfolio-card:hover, .certificate-card:hover { border-color: var(--accent-line); box-shadow: 0 1px 2px rgba(26,35,48,.05), 0 10px 28px rgba(31,78,121,.08); }
.portfolio-card { padding: 28px; display: flex; flex-direction: column; height: 100%; min-width: 0; }
.portfolio-card h3, .certificate-card h3 { margin: 0 0 14px; color: var(--ink); font-family: var(--serif); font-size: 1.28rem; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; }
.card-copy p { margin: 0 0 20px; }
.card-copy p:last-child { margin-bottom: 0; }
.card-copy strong { color: var(--ink); font-weight: 600; }
.tech-tags { display: flex; gap: 7px; flex-wrap: wrap; list-style: none; padding: 0; margin: 23px 0 0; }
.tech-tags li { padding: 3px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-strong); font-size: .72rem; line-height: 1.6; }
.card-links { display: flex; flex-wrap: wrap; gap: 14px; padding-top: 24px; margin-top: auto; font-size: .81rem; font-weight: 600; }
.card-links a, .certificate-link { color: var(--accent); text-underline-offset: 4px; }
.card-links a:hover, .certificate-link:hover { text-decoration: underline; }

.research-panel { padding: 32px; border-left: 4px solid var(--accent); }
.research-panel h3 { margin-top: 18px; font-family: var(--serif); font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; }
.research-panel h3 a { text-decoration: none; color: var(--ink); }
.research-panel h3 a:hover { color: var(--accent); }
.research-panel > p:last-child { margin-bottom: 0; font-size: .88rem; }

/* Skills: label column + values, like the résumé table */
.skills-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 28px; margin: 0; }
.skills-row { display: grid; grid-template-columns: 170px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.skills-row:last-child { border-bottom: 0; }
.skills-row dt { font-family: var(--serif); font-weight: 600; color: var(--ink); }
.skills-row dd { margin: 0; display: flex; flex-wrap: wrap; gap: 7px; }
.skills-row dd span { padding: 2px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-strong); font-size: .8rem; line-height: 1.7; }

.certificate-card { overflow: hidden; min-width: 0; height: 100%; }
.certificate-image { display: flex; align-items: center; justify-content: center; aspect-ratio: 1.65; padding: 18px; background: var(--accent-soft); border-bottom: 1px solid var(--border); }
.certificate-image img { display: block; width: 100%; height: 100%; object-fit: contain; margin: 0; }
.certificate-details { padding: 24px; }
.certificate-details .card-label { font-size: .65rem; letter-spacing: .075em; }
.certificate-card h3 { margin-bottom: 8px; font-size: 1.12rem; }
.certificate-date { color: var(--muted); font-size: .8rem; margin: 0 0 19px; }
.certificate-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.certificate-link { display: inline-flex; gap: 8px; align-items: center; min-height: 36px; font-size: .85rem; font-weight: 600; }

[data-paginated] > [hidden] { display: none !important; }
.portfolio-pagination { margin-top: 24px; text-align: center; }
.pagination-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pagination-controls button:first-child { justify-self: start; }
.pagination-controls button:last-child { justify-self: end; }
.pagination-controls button { min-width: 44px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--accent-line); border-radius: 6px; background: var(--surface); color: var(--accent); font: 500 .85rem/1.4 var(--sans); cursor: pointer; }
.pagination-controls button:hover:not(:disabled) { background: var(--accent-soft); }
.pagination-controls button:disabled { opacity: .45; cursor: default; }
.pagination-status { margin: 0; color: var(--muted); font-size: .8rem; white-space: nowrap; }
.contact-note { padding: 24px 0 0; }

/* Intro */
.profile-intro { max-width: 920px; margin: 0 auto; padding: 76px 24px 56px; display: grid; grid-template-columns: 1fr 200px; gap: 56px; align-items: center; }
.eyebrow { color: var(--accent); font-size: .7rem; font-weight: 650; letter-spacing: .15em; margin-bottom: 14px; }
.profile-intro h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 600; letter-spacing: -.015em; line-height: 1.1; margin: 0 0 8px; color: var(--ink); }
.profile-role { font-family: var(--serif); font-size: 1.15rem; color: var(--accent); margin: 0 0 22px; }
.intro-bio, .prose p { text-align: left; overflow-wrap: break-word; }
.intro-bio { color: var(--text); font-size: 1rem; line-height: 1.85; }
.profile-photo { width: 200px; height: 200px; object-fit: cover; object-position: center 20%; border-radius: 50%; border: 3px solid var(--accent); padding: 4px; background: var(--surface); box-shadow: 0 12px 32px rgba(31,78,121,.14); }
.profile-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; font-size: .88rem; font-weight: 550; }
.profile-links a { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--accent-line); border-radius: 6px; background: var(--surface); color: var(--accent); text-decoration: none; transition: background-color .15s, border-color .15s; }
.profile-links a:hover { background: var(--accent-soft); border-color: var(--accent); }

a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.prose a { text-underline-offset: 4px; }
.status-label { display: inline-block; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); border-radius: 20px; padding: .3rem .75rem; font: 600 .72rem/1.6 var(--sans); letter-spacing: .025em; }
footer { border-top: 1px solid var(--border); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .portfolio-card, .certificate-card, .profile-links a { transition: none; } }
@media (max-width: 680px) {
  .profile-intro { grid-template-columns: 1fr; gap: 24px; padding: 36px 16px; }
  .profile-photo { grid-row: 1; width: 120px; height: 120px; }
  .portfolio-section { padding: 28px 16px; }
  .portfolio-grid { grid-template-columns: 1fr; gap: 18px; }
  .portfolio-card, .research-panel { padding: 22px; }
  .certificate-details { padding: 22px; }
  .skills-panel { padding: 4px 20px; }
  .skills-row { grid-template-columns: 1fr; gap: 8px; }
}
</style>
